name: Verify JSON Object Builder plugin

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    uses: edigonzales/hop-plugin-ci/.github/workflows/verify.yml@f0a1eec368cb8c5d2592086b26393a6fc3916ad1
    with:
      java-versions: '["21", "25"]'
      runner-os: '["ubuntu-latest", "windows-latest"]'
      canonical-runner-os: ubuntu-latest
      canonical-java-version: '21'
      maven-working-directory: .
      maven-options: -U -B -ntp
      maven-goals: clean verify
      compatibility-goals: clean test
      pom-file: pom.xml
      artifact-name-prefix: hop-json-object-builder-plugin
      artifacts: >-
        [{"file":"assemblies/assemblies-hop-json-object-builder/target/hop-json-object-builder-plugin-*.zip"}]
      validation-command: |
        python3 scripts/verify-package.py
    secrets: inherit
